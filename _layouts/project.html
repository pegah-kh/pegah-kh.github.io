<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0 auto;
      padding: 2em 1em;
      max-width: 850px;
      color: #222;
      line-height: 1.7;
    }

    h1 {
      text-align: center;
      font-size: 1.8em;
      font-weight: 600;
      margin-bottom: 0.2em;
    }

    h2 {
      text-align: center;
      font-size: 1.2em;
      font-weight: normal;
      margin-top: 0;
    }

    .authors {
      text-align: center;
      margin-top: 1em;
      margin-bottom: 0.5em;
    }

    .authors span {
      color: #c00;
      margin: 0 0.6em;
      font-weight: 500;
    }

    .affiliation {
      text-align: center;
      font-size: 0.95em;
      margin-bottom: 1em;
      color: #555;
    }

    .links {
      text-align: center;
      margin-bottom: 1.5em;
    }

    .links a {
      text-decoration: none;
      color: #c00;
      margin: 0 0.7em;
      font-weight: 500;
    }

    hr {
      border: none;
      border-top: 1px solid #ccc;
      margin: 2em 0;
    }

    .section {
      margin-bottom: 2em;
    }

    .section h3 {
      text-align: center;
      font-size: 1.4em;
      font-weight: bold;
      margin-bottom: 1em;
    }

    .section img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }

    .abstract p {
      margin: 0 auto;
      text-align: justify;
    }
  </style>
</head>
<body>

  <h1>{{ page.title }}</h1>
  <h2>{{ page.subtitle }}</h2>

  <div class="authors">
    {% for author in page.authors %}
      <span>{{ author }}</span>
    {% endfor %}
  </div>

  <div class="affiliation">{{ page.affiliation }}</div>

  <div class="links">
    {% if page.paper_url %}<a href="{{ page.paper_url }}">[Paper]</a>{% endif %}
    {% if page.code_url %}<a href="{{ page.code_url }}">[Code]</a>{% endif %}
  </div>

  <hr>

  <div class="section abstract">
    <h3>Abstract</h3>
    {{ content }}
  </div>

  {% if page.method_image %}
    <hr>
    <div class="section">
      <h3>Method</h3>
      <img src="{{ page.method_image | relative_url }}" alt="Method Diagram">
    </div>
  {% endif %}

</body>
</html>
